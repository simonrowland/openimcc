        deciding_criterion: >-
          Used the arithmetic mean of Na2O 33.95 and K2O 33.53 J/(mol K),
          with their 0.21 J/(mol K) half-range as the input spread.
        references:
        - https://info.ornl.gov/sites/publications/Files/Pub57741.pdf
        - https://doi.org/10.1063/1.555706
      liquid_heat_capacity:
        value_J_per_mol_K: 97.75
