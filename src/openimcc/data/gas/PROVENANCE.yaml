schema_version: openimcc.gas_provenance.v1
source_notes:
  janaf:
    database: NIST Standard Reference Database 13
    citation: Chase, M. W. Jr., NIST-JANAF Thermochemical Tables, 4th Edition, J. Phys. Chem. Ref. Data Monograph 9 (1998)
    doi: 10.18434/T42S31
    licence: NIST SRD 13 data are public and may be distributed or copied.
    gas_standard_state: Gas standard pressure is 0.1 MPa (1 bar).
    ion_reference_convention: >-
      Gas species, including ions and electrons, use p° = 0.1 MPa (1 bar).
      D-020 treats e-(g) with the monatomic ideal-gas convention and tabulates
      H°(T)-H°(0). Ion formation quantities use JANAF's elemental reference
      states. The fitted ion rows use JANAF's printed functions with that
      electron row; no +6.197 kJ/mol shift is applied.
      Some ion-table notes specify that adjustment only for conversion to the
      alternate convention that excludes the electron.
    ion_convention_reference: https://janaf.nist.gov/pdf/JANAF-FourthEd-1998-1Vol1-Intro.pdf
  trace_parent_channels:
    retrieval_date: '2026-10-01'
    activity_policy: >-
      Li2O, Rb2O, PbO, Cs2O, Cu2O, SnO, Ga2O3, GeO2, B2O3, and In2O3
      activities are supplied by the caller. OpenIMCC has no trace-element
      activity model; no activity coefficients are applied. Published silicate-
      melt activity-coefficient work is cited in README.md as context only and
      does not enter these runtime rows.
    reference_states: >-
      The NIST-JANAF and NASA Glenn records use the stable elemental reference
      states at 298.15 K for Li, Rb, Pb, Ga, Ge, B, and In. NASA/TP-2002-211556 specifies
      ideal gases at 1 bar and pure condensed phases at 1 atm. NASA gas cards
      therefore need no pressure-standard conversion. The Rb2O(l) activity is
      relative to the NASA pure-liquid 1 atm standard. Ga2O3(l), GeO2(l), and
      In2O3(l) retain their NASA pure-liquid 1 atm reference. The PbO(l) tail
      uses NASA H and S increments anchored to the JANAF 1 bar row at 2500 K.
      No liquid pressure correction is applied because no source molar volume
      is included; that small 1 atm-to-1 bar correction remains unquantified.
    nasa_cards:
      citation: >-
        McBride, B. J.; Zehe, M. J.; Gordon, S. (2002), NASA Glenn Coefficients
        for Calculating Thermodynamic Properties of Individual Species,
        NASA/TP-2002-211556; NASA CEA thermo.inp.
      upstream_source_sha256: fa7746572952d74e249e818a82a35c113829742fb421a308e167185528884363
      records_are: >-
        Published model-derived NASA Glenn/CEA seven-coefficient functions;
        no standalone Gurvich/IVTAN table cells were transcribed.
    declined_ions:
      In+:
        source_record: NG-6016
        source_locator: "thermo.inp lines 6017-6027"
        source_sha256: 2ca1ace033413d51c8f2bcb88d3c05c37bf39d107b46442b671e5896ca237784
        card_dfH298_J_per_mol: 6996.425
        neutral_source_record: NG-6005
        neutral_dfH298_J_per_mol: 240700.0
        NIST_ionisation_energy_eV: 5.78636
        fitted_vs_saha:
        - temperature_K: 1500
          fitted_K_ion: 5293385888.0
          saha_K_ion: 3.505390251e-19
          fitted_to_saha_ratio: 1.510070351e+28
        - temperature_K: 2500
          fitted_K_ion: 6870174.263
          saha_K_ion: 7.514218545e-11
          fitted_to_saha_ratio: 9.142899187e+16
        disposition: "Declined; source retained without coefficient changes; In+ omitted from runtime."
      Cu+:
        source_record: Cu-006
        source_path: data-src/janaf/Cu-006.txt
        source_sha256: 7699877b974780f89a88b8328d50996e4ab227c0f61c567daabe185fa8a8f9bf
        NIST_ionisation_energy_eV: 7.72638
        NIST_WebBook: https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440508&Mask=1020
        ground_term_weights_Cu_to_Cu_plus: [2, 1]
        fitted_to_ground_term_saha_ratio:
          1500_K: 1666.15
          2000_K: 1664.34
          2500_K: 1656.61
        disposition: >-
          Declined; source retained without coefficient changes and Cu+ omitted
          from runtime. The anomalous entropy is present in the published
          JANAF Cu-006 table, so this is a source-consistency failure.
    electron_attachment_checks:
      Cu-:
        source_record: Cu-007
        source_path: data-src/janaf/Cu-007.txt
        source_sha256: 2e45a80821a53dcd1f581910e0d2e109c3fb7be0f6026498e45a1460755b2cd6
        NIST_electron_affinity_eV: 1.23578
        NIST_WebBook: https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440508&Mask=1020
        ground_term_weights_Cu_to_Cu_minus: [2, 1]
        equation: >-
          For Cu + e- = Cu-, Kp=(p°/kBT)*(Z-/2Z0)*
          (h²/(2*pi*me*kBT))^(3/2)*exp(EA/kBT).
        unit_check: >-
          p°/(kBT) has units m^-3 and the electron translational factor has
          units m^3, so Kp is dimensionless. This is the inverse cation Saha
          form; detailed balance gives K_attach(Cu)*K_ion(Cu-)=1.
        fitted_to_attachment_ratio:
          1500_K: 0.941424
          2500_K: 0.958988
        implied_Cu007_electron_affinity_eV:
          1500_K: 1.22798
          2500_K: 1.22676
        disposition: >-
          Retained in runtime. The ~1.227 eV implied JANAF affinity differs
          from the modern NIST value by about 0.009 eV, consistent with source
          vintage; a 0.01 eV offset changes K by factors 1.08 at 1500 K and
          1.05 at 2500 K. The regression comparison allows 10%.
    material_disagreements:
      Li2O(l): >-
        The NASA polynomial minus JANAF dfH298+(H-H298)-T*S gives liquid ΔG
        differences (kJ/mol) of -4.098, -3.462, -2.171, and -1.242 at 1800,
        2000, 2500, and 3000 K. NG-1643 begins at 1726 K, so its printed
        formation enthalpy is the crystal anchor, not a liquid formation
        enthalpy. Li2O Cp is 103.999 versus JANAF 100.416 J/(mol K), and ΔS
        ranges from -3.37 to -1.54 J/(mol K). JANAF remains selected; these
        liquid-property differences remain a certification item.
      PbO(l): >-
        The NASA polynomial minus JANAF dfH298+(H-H298)-T*S gives liquid ΔG
        differences (kJ/mol) of -0.002, -0.016, -0.048, and -0.079 at 1800,
        2000, 2500, and 3000 K. NG-1801 begins at 1160 K, so its printed
        formation enthalpy is the crystal anchor. Extrapolated NASA liquid
        H(298.15 K) is -202.139 kJ/mol versus JANAF -202.249; overlap ΔH is
        about 0.11 kJ/mol and ΔS about 0.063 J/(mol K). JANAF remains selected.
        O-007 ends at 2500 K; the NASA H/S tail is anchored there with zero
        ΔH, ΔS, and ΔG. Against continuing JANAF Cp=65 J/(mol K), ΔG at
        3000 K is 0.017 J/mol.
      Rb2O(l): >-
        No NIST-JANAF liquid or gas oxide table was found. NASA card NG-1841
        supplies the liquid function; its own liquid standard state is retained.
    nist_text_records: >-
      The normalized .txt source rows are transcribed from the public NIST
      table text endpoints, with official HTML used for Li-011 and Pb-005
      where the text endpoint was unavailable. Pb-005 retains the complete
      2100 K thermal cells although its printed formation cells switch to
      zeros at the elemental reference-state transition; the fit uses the
      298.15 K anchor plus H-H(298.15 K) and S.
