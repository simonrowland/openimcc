source_comparisons:
  basis: >-
    NASA cards use G_app(T)=H_card(T)-T*S_card(T), where H_card includes the
    assigned elemental reference in b1. JANAF uses dfH298+[H(T)-H(298.15 K)]-T*S(T).
  temperatures_K:
  - 1800
  - 2000
  - 2500
  - 3000
  selection: NIST-JANAF is retained for every paired species; NASA values are recorded
    for comparison.
  standard_state_note: The compared gases use the 1 bar ideal-gas reference. For B2O3(l),
    JANAF uses 1 bar and the NASA CEA liquid card uses its published 1 atm pure-liquid
    reference; no pressure correction is applied.
