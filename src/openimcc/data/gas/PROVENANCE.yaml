    ko_note: >-
      JANAF estimates the KO- formation enthalpy from reaction comparisons.
      The fitted row is model-derived from that table value; its uncertainty
      is not independently quantified.
    ko_reference: https://janaf.nist.gov/pdf/JANAF-FourthEd-1998-Potassium.pdf
  condensate_rows_are_cc_by_4:
    note: Published Lamoreaux coefficients and the K2O input estimates retain their source attribution below.
  trace_channel_additions:
    activity_policy: >-
      MnO, ZnO, CdO, Bi2O3, TeO2, SeO2, and As2O3 parent activities are caller supplied. OpenIMCC
      does not provide an activity model or activity coefficients for these channels.
    source_selection:
      Mn: >-
        Mn(g) and Mn+(g) use JANAF tables Mn-005 and Mn-006. No JANAF MnO(g)
        row is indexed; TSIV Table 1436 supplies MnO(g). MnO(l) is built by the
        same liquid_from_solid construction and input record as the redox pack,
        using the TSIV Table 1435 crystal function and measured melting point.
      Ni: >-
        Ni(g) and Ni+(g) use JANAF. NiO(g) uses the tier-2 NASA Glenn NG-0926
        card selected over tier-3 Bulletin 672; the measured G_app difference
        from Bulletin 672 is banded over their common range. NiO(l) uses the
        phase-paired estimated liquid branch in TSIV Volume IV Table 2026
        (tier 3), with the source's stated Phi uncertainty. Below its 2228 K
        source limit, the fitted branch is a labelled continuation, not printed
        source data. NiO activity is caller-supplied.
      Co: >-
        Co(g) and Co+(g) use JANAF. CoO(g) uses TSIV Volume IV Table 1335
        (accuracy class 4-F). CoO(l) uses the phase-paired estimated liquid
        branch in TSIV Volume IV Table 1334 (tier 3), with the source's stated
        Phi uncertainty. Below its 2090 K source limit, the fitted branch is a
        labelled continuation, not printed source data. CoO activity is
        caller-supplied.
      Zn: >-
        JANAF Zn(g), Zn+(g), and Zn-(g) rows are retained. The NASA Glenn Zn
        atom and cation cards are comparison-only; their G_app differences are
        recorded below. The ZnO(g) IVTAN table supplies direct 1-bar gas cells.
      Cd: >-
        The JANAF fourth-edition index contains no Cd table, so Cd(g) and Cd+(g)
        use NASA Glenn cards as the tier-2 fallback. CdO(g) is an explicitly
        estimated Pankratz table; CdO(l) is the tier-4 crystal-to-liquid
        construction because no stable 1-bar liquid row is available.
      Bi: >-
        JANAF and TSIV list no Bi(g) table. Pankratz Table 80 supplies Bi(g),
        Table 81 supplies Bi2(g), and Bulletin 696 Table 115 supplies BiO(g).
        Bi2O3(l) is selected as the Bi(III) parent because Table 82 prints its
        liquid branch; no other bismuth-oxide liquid parent is offered.
      Te: >-
        Pankratz Bulletin 672 Tables 415 and 416 supply Te(g) and Te2(g), and
        its Tellurium Dioxide tables supply TeO2(g) and a measured TeO2(l)
        branch. TeO2(l) is the Te(IV) parent by tier-1 phase-pair consistency.
        No TeO(g) source was found in Bulletin 672, JANAF, NASA Glenn/CEA,
        NIST WebBook, or Gurvich/IVTAN. Te+(g) had no source in the checked
        JANAF, NASA Glenn/CEA, NIST WebBook, or Gurvich/IVTAN routes. Telluride
        dissolution in reduced melts is outside the caller-supplied oxide
        parent convention.
      Se: >-
        Pankratz Bulletin 672 supplies Se(g), Se2(g), SeO(g), and SeO2(g);
        the SeO table is on printed pp. 376-377. Se2 entropy nodes at 1400 K
        and 1800 K match the scan, and its printed Cp equation agrees within
        rounding.
        For SeO2(g), the printed 958 K node is retained despite its measured
        Cp/H/S mismatch with the source equations, which supply fit nodes
        through 1500 K. The OECD/NEA selenium review rejects the often-cited
        613 K fusion point and selects 660 K with a 22 +/- 5 kJ/mol fusion
        enthalpy. SeO2(l) is the tier-4 crystal-Cp carry-over construction
        because no standard liquid function is available. Se+(g) had no source
        in the checked Bulletin 672, JANAF, NASA Glenn/CEA, NIST WebBook, or
        Gurvich/IVTAN routes.
      As: >-
        Pankratz Bulletin 672 supplies As(g), As2(g), As4(g), As4O6(g), and the
        Table 53 As2O3 crystal function. As2O3(l) is the only selected oxide
        parent and uses the tier-4 liquid_from_solid construction with the
        repository's tier-3 fusion-entropy and liquid-Cp rules; its leave-one-
        out band is based on the 48 JANAF fusion-pair calibration and is
        extrapolated beyond +800 K. No AsO(g) source was located in Bulletin
        672, JANAF, NASA Glenn/CEA, NIST WebBook, or Gurvich/IVTAN. As+(g) had
        no source in the checked JANAF, NASA Glenn/CEA, NIST WebBook, or
        Gurvich/IVTAN routes.
      Y: >-
        Pankratz Bulletin 672 printed p. 474 supplies Y(g) and printed p. 475 supplies
        the elemental-reference Y2O3(cr) function. Pedley and Marshall (1983)
        Table 5 selects ΔfH°298(YO) = -46 +/- 10 kJ/mol, and Tables 9 and 11
        supply its thermal function. The required Y2O3(l) parent is a tier-4
        liquid_from_solid construction. Its 2712 K melting point is from the
        high-temperature phase-equilibrium literature (2712 +/- 12 K). Kapush et al.'s
        119 +/- 10 kJ/mol cubic-crystal-to-liquid step is used directly as the
        fusion input. Pankratz p. 475 separately prints a 0.310 kcal/mol alpha-beta
        transition at 1330 K; this is already in the crystal function and is not
        subtracted from the melting-region fusion step. The crystal table prints
        source nodes through 2000 K. Y2O3 activity is caller supplied. JANAF, NASA,
        Pankratz 672/677/696, TSIV, NIST WebBook, OECD/NEA and Burcat routes
        were checked for Y+; no temperature-dependent Y+(g) function was
        located, so C3 is declined.
    measured_continuation_bands: >-
      Gas continuation bands are maximum held-Cp errors measured by truncating
      published JANAF gas tables at the matching source-node limit. The
      Bi2O3(l) band is the maximum held-Cp error measured against nine JANAF
      parent-liquid tables truncated at 1300 K. These source-data back-tests
      define continuation bands and are not benchmark tuning.
