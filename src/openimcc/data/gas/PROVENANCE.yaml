source_comparisons:
  basis: >-
    NASA gas cards use G_app(T)=dfH298+[H(T)-H(298.15 K)]-T*S(T), with each
    card's printed 298.15 K formation anchor. For NASA liquid cards NG-1701,
    NG-2013, and NG-1857, the card-G comparison uses H_card(T)-T*S_card(T), the
    liquid fitter's basis; header-anchored values are labelled separately where
    recorded. JANAF uses its printed dfH298+[H(T)-H(298.15 K)]-T*S(T) cells.
  temperatures_K:
  - 1800
  - 2000
  - 2500
  - 3000
  selection: NIST-JANAF is retained for paired JANAF/NASA species; for NiO(g),
    the tier-2 NASA Glenn card is selected over the tier-3 Bulletin 672 table.
  standard_state_note: The compared gases use the 1 bar ideal-gas reference. The JANAF
    parent liquids MoO3(l) (Mo-015), WO3(l) (O-066), BaO(l) (Ba-035), SrO(l)
    (O-014), and ZrO2(l) (O-053) are 1 bar standards. Their NASA CEA comparison
    cards NG-1701, NG-2013, NG-1325, NG-1917, and NG-2029 use pure-liquid 1 atm
    standards, with no pressure correction; the same 1 bar versus 1 atm pairing
    applies to the compared B2O3(l) rows.
