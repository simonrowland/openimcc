schema_version: openimcc.gas_provenance.v1
source_notes:
  janaf:
    database: NIST Standard Reference Database 13
    citation: Chase, M. W. Jr., NIST-JANAF Thermochemical Tables, 4th Edition, J. Phys. Chem. Ref. Data Monograph 9 (1998)
    doi: 10.18434/T42S31
    licence: NIST SRD 13 data are public and may be distributed or copied.
    gas_standard_state: Gas standard pressure is 0.1 MPa (1 bar).
    ion_reference_convention: >-
      Gas species, including ions and electrons, use p° = 0.1 MPa (1 bar).
      D-020 treats e-(g) with the monatomic ideal-gas convention and tabulates
      H°(T)-H°(0). Ion formation quantities use JANAF's elemental reference
      states. The fitted ion rows use JANAF's printed functions with that
      electron row; no +6.197 kJ/mol shift is applied.
      Some ion-table notes specify that adjustment only for conversion to the
      alternate convention that excludes the electron.
    ion_convention_reference: https://janaf.nist.gov/pdf/JANAF-FourthEd-1998-1Vol1-Intro.pdf
  halogen_gas_parent_channels:
    reference_states: >-
      Br2(g), Br(g), I2(g), I(g), NaBr(g), (NaBr)2(g), KBr(g), (KBr)2(g),
      KI(g), (KI)2(g), Cl2(g), Cl(g), NaCl(g), (NaCl)2(g), KCl(g),
      (KCl)2(g), F2(g), F(g), NaF(g), (NaF)2(g), KF(g), and (KF)2(g) use
      the elemental-reference 298.15 K formation enthalpy printed in their
      respective JANAF table: Br-040, Br-001, I-027, I-001, Br-030, Br-064,
      Br-018, Br-055, I-007, I-028, Cl-073, Cl-001, Cl-056, Cl-098, Cl-039,
      Cl-091, F-054, F-001, F-036, F-082, F-020, and F-069.
      NaI(g) and (NaI)2(g) use the elemental-reference formation enthalpy in
      NASA Glenn cards NG-0893 and NG-0904. The Br2 and I2 caller activities
      and new Cl2 and F2 caller activities use the JANAF 1-bar gas standard;
      Na2O(l) is from Na-013 and K2O(l) is the existing K-012
      liquid_from_solid estimate. O2(g) is O-029.
    selection: >-
      JANAF is selected for every available halogen product table. NASA Glenn
      supplies NaI(g) and (NaI)2(g), for which no JANAF product table is
      available. NG-0901 is vendored only to compare (NaBr)2(g); the selected
      runtime product remains JANAF Br-064. NASA NG-0494 (Cl2) and NG-0567
      (F2) are elemental-reference cross-checks for the selected chlorine and
      fluorine JANAF rows.
    closure: >-
      Tests compare each new JANAF table's printed formation Gibbs energy
      against its own log Kf cells and independently calculate channel
      pressures from printed G° cells at 1800 and 2200 K.
  ionization_and_attachment_audits:
    Hf_plus:
      sources: Hf-006/Hf-007; NIST ASD neutral/ion levels and ionization energy 6.825070 eV
      gate: 2% Saha ratio
      ratios: {1500_K: 1.2358655503, 2500_K: 0.7944302178}
      cause: >-
        The JANAF Hf-006/Hf-007 formation functions are not thermochemically
        consistent with the NIST ASD spectroscopic Saha pair; the measured
        ratios are disclosed without adjusting either source.
    Th_plus:
      sources: P672-Th-g/Burcat-Th-plus; NIST ASD neutral/ion levels and ionization energy 6.30670 eV
      gate: 2% Saha ratio
      ratios: {1500_K: 4.4960411241, 2500_K: 2.5579593377}
      cause: >-
        Pankratz Th(g) has dfH298 597.2 kJ/mol while Burcat's Gurvich-based
        neutral card has 602.0 kJ/mol; the adopted Pankratz neutral/Burcat
        cation pair therefore retains this source-vintage offset. Ratios are
        measured comparisons, not coefficient adjustments.
    Hf_minus:
      sources: Hf-006/Hf-008; Tang et al. (2018) measured EA 0.1780(6) eV and NIST ASD levels
      ratios: {1500_K: 0.1682162495, 2500_K: 0.2917159887}
      cause: >-
        The NIST WebBook Hf atom page has no atomic electron-affinity entry,
        so the primary Tang et al. measurement is used. JANAF's formation
        difference Hf-008 minus Hf-006 is -6.198 kJ/mol, equivalent to about
        0.0642 eV, below the measured 0.1780 eV affinity;
        the attachment ratios disclose this source offset.
  trace_parent_channels:
    retrieval_date: '2026-10-01'
    activity_policy: >-
      Li2O, Rb2O, PbO, Cs2O, Cu2O, SnO, Ga2O3, GeO2, B2O3, In2O3, TeO2, SeO2,
      As2O3, MoO3, WO3, BaO, SrO, ZrO2, NiO, CoO, Sc2O3, UO2, ThO2, HfO2,
      La2O3, Ce2O3, CeO2, Pr2O3, and Nd2O3
      activities are supplied by the caller. OpenIMCC has no trace-element
      activity model; no activity coefficients are applied. Published silicate-
      melt activity-coefficient work is cited in README.md as context only and
      does not enter these runtime rows.
    reference_states: >-
      The NIST-JANAF and NASA Glenn records use the stable elemental reference
      states at 298.15 K for Li, Rb, Pb, Ga, Ge, B, and In. NASA/TP-2002-211556 specifies
      ideal gases at 1 bar and pure condensed phases at 1 atm. NASA gas cards
      therefore need no pressure-standard conversion. The Rb2O(l) activity is
      relative to the NASA pure-liquid 1 atm standard. Ga2O3(l), GeO2(l), and
      In2O3(l) retain their NASA pure-liquid 1 atm reference. The PbO(l) tail
      uses NASA H and S increments anchored to the JANAF 1 bar row at 2500 K.
      No liquid pressure correction is applied because no source molar volume
      is included; that small 1 atm-to-1 bar correction remains unquantified.
    rare_earth_reference_states: >-
      Konings Part 1 Table 42 supplies the elemental 298.15 K formation anchors
      for La(g), Ce(g), Pr(g), Nd(g), Sm(g), Eu(g), and Gd(g); Part 2 Table 89 supplies the monoxide
      and CeO2(g) anchors. Part 2 Table 88 supplies the condensed phase-chain
      anchors. Ce(g), CeO(g), and CeO2(g) use Ce2O3(l), Ce2O3(l), and CeO2(l)
      parents respectively; the dioxide uses CeO2(l) by same-state pairing.
      PrO2 and PrO1.833 are source crystals that decompose and have no liquid
      parent. All parent activities are supplied by the caller. Sm2O3(l) uses
      the fully specified B-form 298.15 K anchor because Table 88 gives no S298
      for Sm2O3(C); the C-to-B step does not replace that independent anchor.
    molybdenum_and_tungsten_anchors: >-
      JANAF gas and ion rows Mo-005, Mo-006, Mo-007, Mo-008, Mo-010, Mo-017,
      W-005, W-006, W-007, O-027, O-048, O-068, O-088, O-092, O-093, and
      O-096 take each species' formation enthalpy from that table's 298.15 K
      row, formation_enthalpy cell, on the elemental reference states printed
      for the table. Parent liquid anchors are the same cell in Mo-015 and
      O-066; their thermal rows follow the printed liquid branch. JANAF has no
      rows for (MoO3)2-5 or (WO3)5. Those NASA-only species use the
      delta_f_H_298_15.value header cell of CEA records NG-0831 through
      NG-0834 and NG-1258 respectively, with the card's elemental-reference
      gas functions. The fitting code subtracts each NASA polynomial's own
      H(298.15 K) before applying that printed formation anchor.
    molybdenum_and_tungsten_parent_choice: >-
      MoO3(l) is the Mo parent because JANAF has a measured MoO3 liquid
      branch; MoO2 has crystal data only and is not offered as a liquid
      parent. WO3(l) is the W parent for the same reason; WO2 has crystal
      data only and is not offered as a liquid parent.
    molybdenum_and_tungsten_spectroscopic_checks: >-
      NIST Atomic Spectra Database Handbook tables list Mo I/II and W I/II
      fine-structure levels used by the Saha audit. W I's 5D multiplet runs
      through 6219.33 cm-1, its 7S level is at 2951.29 cm-1, and its low 3P
      levels extend through 19253.56 cm-1. W II's 6D multiplet runs through
      6147.085 cm-1; the 6S and 4F terms extend through 14857.160 cm-1.
      These cover the low terms relevant through 3000 K. With NIST ionisation
      energies Mo 7.09243 eV and W 7.86403 eV,
      JANAF fitted/Saha ratios are Mo 0.947968, 0.968318, 0.972794 and W
      0.936824, 1.881118, 2.151220 at 1500, 2500, and 3000 K. These retained
      JANAF ion rows differ from the spectroscopic partition calculation;
      ratios are pinned in tests rather than covered by a widened tolerance.
      W-006/W-005 imply a 0 K ionization enthalpy of 770.396 kJ/mol, from
      1620.178 minus 849.782 kJ/mol, versus the NIST IE 7.86403 eV =
      758.764 kJ/mol: 11.632 kJ/mol (0.121 eV) higher. JANAF's ionization
      entropy is about 12 J/(mol K) larger than the NIST ASD partition
      functions give; that entropy term grows with T and carries the fitted/
      Saha ratio from 0.937 at 1500 K to 2.15 at 3000 K. The full ASD level
      list changes the ratio by <0.004.
      Sources: https://physics.nist.gov/PhysRefData/Handbook/Tables/molybdenumtable5.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/molybdenumtable6.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/tungstentable5_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/tungstentable6.htm.
    molybdenum_and_tungsten_attachment_checks: >-
      NIST WebBook electron affinities are 0.74942 eV for Mo (Bilodeau et al.
      1998) and 0.816265 eV for W (Lindahl et al. 2010). JANAF fitted to
      NIST-attachment ratios are Mo 0.973771 and 0.978265 and W 1.776094 and
      1.143731 at 1500 and 2500 K. JANAF 298.15 K anchors imply affinities of
      about 0.810 eV for Mo and 0.880 eV for W. The offsets are source-
      consistency differences in JANAF Mo-007/W-007 relative to the measured
      affinities, not fit residuals; values are asserted in tests.
      Sources: https://webbook.nist.gov/cgi/cbook.cgi?ID=C7439987&Mask=267,
      https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440337&Mask=267.
    ba_strontium_zirconium_anchors_and_parents: >-
      Every JANAF gas and ion fit uses that species table's 298.15 K
      formation_enthalpy cell on its printed elemental reference states:
      Ba-005 179.075, Ba-006 688.126, Ba-037 -123.846, Sr-006 164.000,
      Sr-007 719.666, O-016 -13.389, Zr-006 610.027, Zr-007 1277.880,
      O-028 58.576, and O-055 -286.186 kJ/mol. The parent liquid anchors
      are the 298.15 K formation_enthalpy cells in Ba-035 (-491.627), O-014
      (-517.292), and O-053 (-1023.155 kJ/mol). The liquid rows fit the
      printed JANAF cells. Ba-035 prints glass cells below its 1600.010 K glass
      join and supercooled-liquid cells from 1700 through 2200 K below its
      2286 K crystal/liquid marker. O-014 prints glass cells below its 2000.010 K
      glass join and supercooled-liquid cells below its 2938 K melt marker.
      O-053 prints glass cells below its 2000 K glass join and
      supercooled-liquid cells below its 2950 K melt marker. BaO, SrO,
      and ZrO2 are selected as parents because each has a JANAF liquid table;
      no alternate oxide liquid is offered. Caller-supplied activities are
      required; no activity model or gamma values are included.
    ba_strontium_zirconium_spectroscopic_checks: >-
      Saha partition functions use the low terms listed in NIST Atomic Spectra
      Database Handbook tables 5/6, including Ba I 6s5d 3D levels at 9033.966,
      9215.501, and 9596.533 cm-1 and every listed Zr I/II term below
      20,000 cm-1. The first omitted Zr II manifold starts at 27,983.864 cm-1.
      NIST ionization energies are Ba 5.211664 eV, Sr 5.6948672 eV, and Zr
      6.63412 eV. JANAF fitted/Saha ratios at 1500, 2500, and 3000 K are Ba
      0.999607, 0.999722, 0.999631 and Sr 1.000162, 1.000076, 1.000043;
      these agree within 2%. Zr ratios are 0.187223, 0.380302, and 0.454302.
      The pinned Zr+ ratios correspond to a roughly 20 kJ/mol Gibbs offset
      (−RT ln(ratio)). The 298.15 K JANAF ion/neutral enthalpy difference is
      667.853 kJ/mol, 27.758 kJ/mol above NIST's 6.63412 eV (640.095 kJ/mol);
      it includes the 5/2 RT thermal-electron term, 6.197 kJ/mol at 298.15 K,
      and is not itself the pinned Gibbs offset. Zr- attachment ratios against
      NIST EA 0.427 eV are
      0.897178, 0.963296, and 0.972007 at 1500, 2500, and 3000 K. Their
      temperature dependence is a JANAF versus spectroscopic partition-entropy
      difference. All measured ratios are pinned in tests.
      Sources: https://physics.nist.gov/PhysRefData/Handbook/Tables/bariumtable5_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/bariumtable6_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/strontiumtable5_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/strontiumtable6_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/zirconiumtable5_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/zirconiumtable6_a.htm,
      https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440677&Mask=61.
    nickel_cobalt_ion_checks: >-
      Ni+ and Co+ are in the same NIST-level Saha audit. Their measured JANAF
      fitted/Saha ratios are Ni 165.896 and 259.904 and Co 1.139494 and
      1.293826 at 1500 and 2500 K. Ni-006 minus Ni-005 gives an ionization
      enthalpy of 748.888 kJ/mol, 11.759 kJ/mol above NIST's 7.6398 eV;
      the ratio-implied split is about 14.0 kJ/mol from the enthalpy anchor
      and 51.8 J/(mol K) from the JANAF partition-entropy difference over
      this range. Co-006 minus Co-005 gives 764.921 kJ/mol, 4.520 kJ/mol above
      NIST's 7.8810 eV; ratios imply about 4.0 kJ/mol and 3.7 J/(mol K).
      These retained source offsets are pinned in tests. Ni- and Co- are also
      checked against NIST electron affinities
      1.15717 and 0.66330 eV using the measured Ni- 2D fine-structure splitting
      1470 cm-1 and Co- 3F levels at 920.9 and 1550.3 cm-1. JANAF attachment
      ratios are Ni 0.990922 and 0.994559 and Co 0.983859 and 0.990241 at
      1500 and 2500 K. JANAF enthalpy differences imply affinities 6.7 kJ/mol
      (Ni) and 6.0 kJ/mol (Co) above the NIST values; corresponding entropy
      offsets nearly cancel these anchor differences, leaving the small
      measured Gibbs residuals. All ratios are pinned, not absorbed into the
      spectroscopy tolerance. Sources:
      https://physics.nist.gov/PhysRefData/Handbook/Tables/nickeltable5_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/nickeltable6_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/cobalttable5_a.htm,
      https://physics.nist.gov/PhysRefData/Handbook/Tables/cobalttable6_a.htm,
      https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440020&Mask=267,
      https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440484&Mask=267.
    nasa_cards:
      citation: >-
        McBride, B. J.; Zehe, M. J.; Gordon, S. (2002), NASA Glenn Coefficients
        for Calculating Thermodynamic Properties of Individual Species,
        NASA/TP-2002-211556; NASA CEA thermo.inp.
      upstream_source_sha256: fa7746572952d74e249e818a82a35c113829742fb421a308e167185528884363
      records_are: >-
        Published model-derived NASA Glenn/CEA seven-coefficient functions;
        no standalone Gurvich/IVTAN table cells were transcribed.
    declined_ions:
      In+:
        source_record: NG-6016
        source_locator: "thermo.inp lines 6017-6027"
        source_sha256: 2ca1ace033413d51c8f2bcb88d3c05c37bf39d107b46442b671e5896ca237784
        card_dfH298_J_per_mol: 6996.425
        neutral_source_record: NG-6005
        neutral_dfH298_J_per_mol: 240700.0
        NIST_ionisation_energy_eV: 5.78636
        fitted_vs_saha:
        - temperature_K: 1500
          fitted_K_ion: 5293385888.0
          saha_K_ion: 3.505390251e-19
          fitted_to_saha_ratio: 1.510070351e+28
        - temperature_K: 2500
          fitted_K_ion: 6870174.263
          saha_K_ion: 7.514218545e-11
          fitted_to_saha_ratio: 9.142899187e+16
        disposition: "Declined; source retained without coefficient changes; In+ omitted from runtime."
      Cu+:
        source_record: Cu-006
        source_path: data-src/janaf/Cu-006.txt
        source_sha256: 7699877b974780f89a88b8328d50996e4ab227c0f61c567daabe185fa8a8f9bf
        NIST_ionisation_energy_eV: 7.72638
        NIST_WebBook: https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440508&Mask=1020
        ground_term_weights_Cu_to_Cu_plus: [2, 1]
        fitted_to_ground_term_saha_ratio:
          1500_K: 1666.15
          2000_K: 1664.34
          2500_K: 1656.61
        disposition: >-
          Declined; source retained without coefficient changes and Cu+ omitted
          from runtime. The anomalous entropy is present in the published
          JANAF Cu-006 table, so this is a source-consistency failure.
    electron_attachment_checks:
      Cu-:
        source_record: Cu-007
        source_path: data-src/janaf/Cu-007.txt
        source_sha256: 2e45a80821a53dcd1f581910e0d2e109c3fb7be0f6026498e45a1460755b2cd6
        NIST_electron_affinity_eV: 1.23578
        NIST_WebBook: https://webbook.nist.gov/cgi/cbook.cgi?ID=C7440508&Mask=1020
        ground_term_weights_Cu_to_Cu_minus: [2, 1]
        equation: >-
          For Cu + e- = Cu-, Kp=(p°/kBT)*(Z-/2Z0)*
          (h²/(2*pi*me*kBT))^(3/2)*exp(EA/kBT).
        unit_check: >-
          p°/(kBT) has units m^-3 and the electron translational factor has
          units m^3, so Kp is dimensionless. This is the inverse cation Saha
          form; detailed balance gives K_attach(Cu)*K_ion(Cu-)=1.
        fitted_to_attachment_ratio:
          1500_K: 0.941424
          2500_K: 0.958988
        implied_Cu007_electron_affinity_eV:
          1500_K: 1.22798
          2500_K: 1.22676
        disposition: >-
          Retained in runtime. The ~1.227 eV implied JANAF affinity differs
          from the modern NIST value by about 0.009 eV, consistent with source
          vintage; a 0.01 eV offset changes K by factors 1.08 at 1500 K and
          1.05 at 2500 K. The regression comparison allows 10%.
    material_disagreements:
      Bi+(g)/Bi(g): >-
        Wagman Table 22 gives dfH298(Bi+) = 916.7 kJ/mol, while Pankratz
        Table 80 gives dfH298(Bi) = 49.500 kcal/mol = 207.108 kJ/mol. Their
        709.592 kJ/mol difference is 0.451 kJ/mol above the 709.141 kJ/mol
        implied by the NIST 7.2855 eV ionization energy plus the 6.197 kJ/mol
        electron-reference correction. With the published rows and the 1-bar
        JANAF electron function, Kfit/KSaha is 0.977512642 at 1500 K
        (DeltaG difference 283.657 J/mol) and 0.992449983 at 2500 K
        (157.531 J/mol). This is a source-anchor disagreement, not a fit
        residual; the published rows are retained without retuning.
      Li2O(l): >-
        The NASA polynomial minus JANAF dfH298+(H-H298)-T*S gives liquid ΔG
        differences (kJ/mol) of -4.098, -3.462, -2.171, and -1.242 at 1800,
        2000, 2500, and 3000 K. NG-1643 begins at 1726 K, so its printed
        formation enthalpy is the crystal anchor, not a liquid formation
        enthalpy. Li2O Cp is 103.999 versus JANAF 100.416 J/(mol K), and ΔS
        ranges from -3.37 to -1.54 J/(mol K). JANAF remains selected; these
        liquid-property differences remain a certification item.
      PbO(l): >-
        The NASA polynomial minus JANAF dfH298+(H-H298)-T*S gives liquid ΔG
        differences (kJ/mol) of -0.002, -0.016, -0.048, and -0.079 at 1800,
        2000, 2500, and 3000 K. NG-1801 begins at 1160 K, so its printed
        formation enthalpy is the crystal anchor. Extrapolated NASA liquid
        H(298.15 K) is -202.139 kJ/mol versus JANAF -202.249; overlap ΔH is
        about 0.11 kJ/mol and ΔS about 0.063 J/(mol K). JANAF remains selected.
        O-007 ends at 2500 K; the NASA H/S tail is anchored there with zero
        ΔH, ΔS, and ΔG. Against continuing JANAF Cp=65 J/(mol K), ΔG at
        3000 K is 0.017 J/mol.
      Rb2O(l): >-
        No NIST-JANAF liquid or gas oxide table was found. NASA card NG-1841
        supplies the liquid function; its own liquid standard state is retained.
    nist_text_records: >-
      The normalized .txt source rows are transcribed from the public NIST
      table text endpoints, with official HTML used for Li-011 and Pb-005
      where the text endpoint was unavailable. Pb-005 retains the complete
      2100 K thermal cells although its printed formation cells switch to
      zeros at the elemental reference-state transition; the fit uses the
      298.15 K anchor plus H-H(298.15 K) and S.
