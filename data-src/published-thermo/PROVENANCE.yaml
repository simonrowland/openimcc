  - record_id: TSIV-2026
    path: data-src/published-thermo/tsiv-table-2026.json
    source_sha256: 207e97770be3dc70ccb98f44e3b84903638dd5f355e875d118d5cd31a91df1a1
    publication: Gurvich et al., Thermodynamic Properties of Individual Substances, Volume IV, Table 2026, NiO(cr,l)
    source_url: https://www.chem.msu.ru/rus/tsiv/Ni/print-NiO_c.html
    source_locator: Volume IV, Table 2026
    tier: 3
    selection_reason: The source prints the phase-paired NiO liquid function and stated uncertainty inputs; its direct estimated branch is selected over the tier-4 liquid_from_solid construction.
    anchor_note: The same page prints two 298.15 K anchor pairs that differ. The constants table gives H(298.15)-H(0) = 6.736 kJ/mol and S(298.15) = 37.89 J/(mol K); the tabulated function row at 298.15 K gives 6.720 kJ/mol and 37.820 J/(mol K). The record stores the tabulated-row values because the fitter subtracts this anchor from the tabulated H-H(0) column, so H-H(298.15) is zero at 298.15 K only with the matching row value. The 0.016 kJ/mol difference is a source-internal inconsistency, about 0.0004 dex at 2000 K.
