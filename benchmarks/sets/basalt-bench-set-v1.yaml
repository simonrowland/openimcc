    evidence_class: experimental_gibbs_duhem_derived_controller_standard_state_converted
    source_evidence_class: experimental_gibbs_duhem_derived
    reduction_class: authors_own_least_squares
    published_coefficients:
      equation: "-log10(a_SiO2,tridymite) = A_prime/T + B_prime"
      table_1e_minus_4_A_prime: -0.0593
      table_1e_minus_4_delta_A_prime: 0.0026
      A_prime_K: -593
      delta_A_prime_K: 26
      B_prime: 0.435
      delta_B_prime: 0.017
      validity_range_K: [1373.0, 1773.0]
    uncertainty:
      published_coefficient_sigma_log10_dex: 0.0254479105060308
      standard_state_conversion_uncertainty_log10_dex: 0.00379559588654322
      combined_sigma_log10_dex: 0.0257294130764169
      statement: >-
        Published coefficient errors propagated as
        sqrt((delta_A_prime/T)^2 + delta_B_prime^2). The conversion line is a
        separate conservative polymorph sensitivity: the absolute difference
        between Tridymite- and Cristobalite-reference conversions in the cited
        condensed-phase Gibbs functions, divided by R*T*ln(10).
    standard_state_conversion:
      directive: controller_directed
      from_standard_state: pure_solid_SiO2_tridymite
      to_standard_state: pure_liquid_SiO2
      delta_G_fusion_J_mol: 2089.294188
      activity_multiplier: 0.832752790994253
      thermodynamic_source: >-
