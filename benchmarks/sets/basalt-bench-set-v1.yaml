# Yamaguchi activities use the PARENT-OXIDE FORMULA-UNIT basis. Table 1
# a(Na2O) comes from the authors' beta-alumina EMF measurements; Table 2
# a(SiO2) comes from Gibbs-Duhem integration of that measured a(Na2O), followed
# by the authors' own least-squares reduction. The PDF page images, not OCR,
# are numeric authority; all Table 1 and Table 2 coefficients below were
# visually checked against PDF pages 3 and 5.
#
# Controller-directed SiO2 standard-state conversion:
# Premise: mu = mu_trid^0 + RT ln(a_trid) = mu_liq^0 + RT ln(a_liq), and
# DeltaG_fus(T) = mu_liq^0 - mu_trid^0.
# Algebra: ln(a_liq) = ln(a_trid) - DeltaG_fus/(RT), hence
# a_liq = a_trid * exp(-DeltaG_fus/(RT)).
# DeltaG_fus is GSIO2LIQ(T)-GTRIDYM(T) from de Abreu & Fabrichnaya (2024),
# Table 4, DOI 10.3390/solids5020020, whose Si-O functions cite Dumitrescu &
# Sundman (1995), DOI 10.1016/0955-2219(95)93945-Y.
# Unit check: (J/mol)/[(J/(mol K))*K] is dimensionless, valid for exp().
# Sanity at 1473 K: DeltaG_fus=1854.380434 J/mol gives multiplier 0.859493032445
# (<1 below fusion), so a_liq=0.859493032445*a_trid; as DeltaG_fus tends to zero
# at fusion, the multiplier tends to one.
# Conversion uncertainty is separate from the published coefficient errors:
# |G_cristobalite-G_tridymite|/(RT ln 10), retaining Yamaguchi's explicit
# polymorph caveat (Tridymite reference; no Cristobalite correction at 1773 K).
# The scored frozen nodes stop at 1673 K, so no 1773 K extrapolation is emitted.
  - id: yamaguchi1983_a_sio2_liquid_x0205_1373
    population: yamaguchi1983_emf_na2o_sio2
    composition_id: yamaguchi1983_na2o_sio2_x0205
