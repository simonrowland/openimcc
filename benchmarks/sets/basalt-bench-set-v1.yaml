    temperature_K: 1373.0
    composition_wt_pct:
      SiO2: 78.98914
      Na2O: 21.01086
    published_mole_fraction:
      SiO2: 0.795
      Na2O: 0.205
    parent_oxide: SiO2
    species: SiO
    observable: activity
    measured: 0.82683155722015
    as_published_tridymite_activity: 0.99288956598148
    units: dimensionless
