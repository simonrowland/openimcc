        functions cite Dumitrescu & Sundman (1995),
        DOI 10.1016/0955-2219(95)93945-Y.
      uncertainty_basis: >-
        Yamaguchi used Tridymite over 1143-1740 K and explicitly applied no
        correction at 1773 K where Cristobalite is stable. No 1773 K row is
        emitted because it is outside the frozen node set; the polymorph
        sensitivity is nevertheless retained as a separate uncertainty.
    convention: >-
